name: Deploy frontend SSR

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: actions-deploy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'                          # pnpm вместо npm!
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile     # pnpm ci аналог

      - name: Build
        run: pnpm run build                     # без working-directory!

      - name: Upload to temp dir
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ".output,package.json,pnpm-lock.yaml,nitro.json"
          target: "/tmp/electronics-store-front-deploy"
          rm: true


      - name: Deploy from temp
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            sudo rm -rf /var/www/electronics-store-front/.output
            sudo mv /tmp/electronics-store-front-deploy/.output /var/www/electronics-store-front/.output
            sudo mv /tmp/electronics-store-front-deploy/package.json /var/www/electronics-store-front/package.json || true
            sudo mv /tmp/electronics-store-front-deploy/pnpm-lock.yaml /var/www/electronics-store-front/pnpm-lock.yaml || true
            sudo mv /tmp/electronics-store-front-deploy/nitro.json /var/www/electronics-store-front/nitro.json || true
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} /var/www/electronics-store-front


      - name: Restart frontend service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/electronics-store-front
            sudo systemctl daemon-reload
            sudo systemctl restart ${{ secrets.FRONT_SERVICE_NAME }}
