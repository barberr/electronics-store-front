name: Deploy frontend SSR

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: actions-deploy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare deploy archive
        run: |
          tar -czf frontend-deploy.tar.gz \
            .output \
            package.json \
            pnpm-lock.yaml \
            nitro.json

      - name: Upload build
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: frontend-deploy.tar.gz
          target: /tmp

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e

            DEPLOY_DIR=/tmp/electronics-store-front-deploy
            APP_DIR=/var/www/electronics-store-front

            rm -rf "$DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"

            tar -xzf /tmp/frontend-deploy.tar.gz -C "$DEPLOY_DIR"

            sudo rm -rf "$APP_DIR/.output"
            sudo mv "$DEPLOY_DIR/.output" "$APP_DIR/.output"

            sudo mv "$DEPLOY_DIR/package.json" "$APP_DIR/package.json"
            sudo mv "$DEPLOY_DIR/pnpm-lock.yaml" "$APP_DIR/pnpm-lock.yaml"
            sudo mv "$DEPLOY_DIR/nitro.json" "$APP_DIR/nitro.json"

            sudo chown -R \
              ${{ secrets.SSH_USER }}:${{ secrets.SSH_GROUP }} \
              "$APP_DIR"

            rm -rf "$DEPLOY_DIR"
            rm -f /tmp/frontend-deploy.tar.gz

            sudo systemctl restart ${{ secrets.FRONT_SERVICE_NAME }}
            sudo systemctl is-active --quiet ${{ secrets.FRONT_SERVICE_NAME }}
