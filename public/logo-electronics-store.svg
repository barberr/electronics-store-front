<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Квадратный фон -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="#0F172A"/>

  <!-- Иконка: стилизованный чип/плата -->
  <rect x="9" y="9" width="30" height="30" rx="7" fill="#1D4ED8"/>
  <rect x="15" y="15" width="18" height="18" rx="3" fill="white"/>

  <!-- выводы чипа сверху -->
  <rect x="14" y="13" width="4" height="2" rx="1" fill="#93C5FD"/>
  <rect x="22" y="13" width="4" height="2" rx="1" fill="#93C5FD"/>
  <rect x="30" y="13" width="4" height="2" rx="1" fill="#93C5FD"/>

  <!-- выводы чипа снизу -->
  <rect x="14" y="33" width="4" height="2" rx="1" fill="#93C5FD"/>
  <rect x="22" y="33" width="4" height="2" rx="1" fill="#93C5FD"/>
  <rect x="30" y="33" width="4" height="2" rx="1" fill="#93C5FD"/>

  <!-- выводы чипа слева -->
  <rect x="13" y="18" width="2" height="4" rx="1" fill="#93C5FD"/>
  <rect x="13" y="26" width="2" height="4" rx="1" fill="#93C5FD"/>

  <!-- выводы чипа справа -->
  <rect x="33" y="18" width="2" height="4" rx="1" fill="#93C5FD"/>
  <rect x="33" y="26" width="2" height="4" rx="1" fill="#93C5FD"/>

  <!-- Буквы ES внутри чипа -->
  <text x="19" y="24" fill="#1D4ED8" font-size="7" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">
    E
  </text>
  <text x="24" y="30" fill="#1D4ED8" font-size="7" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">
    S
  </text>
</svg>
